name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SBCL and base tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y sbcl curl make python3

      - name: Install Quicklisp
        run: |
          curl -sO https://beta.quicklisp.org/quicklisp.lisp
          sbcl --noinform --non-interactive \
            --load quicklisp.lisp \
            --eval '(quicklisp-quickstart:install)'
          cat >> ~/.sbclrc <<'EOF'
          #-quicklisp
          (let ((quicklisp-init (merge-pathnames "quicklisp/setup.lisp"
                                                 (user-homedir-pathname))))
            (when (probe-file quicklisp-init)
              (load quicklisp-init)))
          EOF

      - name: Install CL dependencies
        run: |
          sbcl --noinform --non-interactive \
            --load ~/quicklisp/setup.lisp \
            --eval '(ql:quickload (list :alexandria :cl-json :cl-ppcre :fiveam))'

      - name: Load system
        run: make load

      - name: Run tests
        run: make test

      - name: Validate traceability
        run: make traceability
